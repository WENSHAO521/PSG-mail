name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "email"
database_id = "d873b5e8-9a84-409a-9726-c0409f3faba4"

[[kv_namespaces]]
binding = "kv"
id = "ee2165a57dc04150b28ac40fdc7a3285"

#[[r2_buckets]]
#binding = "r2"          # R2 对象存储绑定名，不可修改（未使用 R2 则保持注释）
#bucket_name = ""        # ← 填入你的 R2 桶名

#[[send_email]]
#name = "email"          # CF 发件，配置后优先使用

[ai]
binding = "ai"

# Durable Object powering Undo Send / Scheduled Send's short-delay precision
# (mail-worker/src/durable/scheduled-send-alarm.js) — a guaranteed-delivery
# alternative to a ctx.waitUntil()+setTimeout timer, which Cloudflare gives
# no wall-clock reliability guarantee for. NOT a traditional always-on
# server: it only runs when it has an armed alarm or an in-flight request.
# `[[migrations]]` below is Durable Object CLASS migration bookkeeping —
# unrelated to the SQL files in mail-worker/migrations/ (those are D1 schema
# migrations, applied via `wrangler d1 migrations apply`, see that folder's
# README.md).
[[durable_objects.bindings]]
name = "SCHEDULED_SEND_ALARM"
class_name = "ScheduledSendAlarm"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduledSendAlarm"]

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["* * * * *", "*/30 * * * *", "0 16 * * *"]	#每分钟处理定时发送到期邮件，每30分钟刷新分析缓存，每天晚上12点执行每日任务


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""				#管理员的邮箱	示例: admin@example.com
# jwt_secret / maintenance_secret 不要写在这里 —— 用 Worker Secret 存放（同
# Firebase 三项密钥的方式）。两者是两个独立的密钥，不要用同一个值：
#   jwt_secret         只用于签发/校验每个用户的登录 JWT
#   maintenance_secret 只用于 /init（部署引导）与 /reset-admin（管理员密码找回）
# 明文写进 [vars] 意味着任何能读到这份配置文件的人都能拿到它。手动（非 CI）部署时：
#   cd mail-worker
#   npx wrangler secret put jwt_secret
#   npx wrangler secret put maintenance_secret
# CI（.github/workflows/deploy-cloudflare.yml）改用一次性的
# `wrangler deploy --secrets-file <临时文件>`，把代码和这些密钥在同一次部署里
# 一起上传，不再逐个调用 `wrangler secret put`（那样每调一次就会立即产生一次
# 独立部署）。

# ── 云端备份 OAuth（不填则对应入口不显示）────────────────────────
# Google Drive: https://console.cloud.google.com/ → APIs & Services → Credentials
# 回调地址填: https://<your-domain>/backup/oauth/google/callback
#google_client_id = ""
#google_client_secret = ""

# Microsoft OneDrive: https://portal.azure.com/ → App registrations
# 回调地址填: https://<your-domain>/backup/oauth/microsoft/callback
#microsoft_client_id = ""
#microsoft_client_secret = ""

# ── Firebase 推送通知（新邮件到达提醒，不填则推送静默跳过）────────
# 不要把这三项写进本文件——用 wrangler secret 存放，避免明文进 git：
#   cd mail-worker
#   npx wrangler secret put FIREBASE_PROJECT_ID
#   npx wrangler secret put FIREBASE_CLIENT_EMAIL
#   npx wrangler secret put FIREBASE_PRIVATE_KEY   # 完整 PEM，含 BEGIN/END 行
# 三个值都来自 Firebase Console → Project Settings → Service accounts →
# Generate new private key 下载的 JSON（project_id / client_email / private_key）


# NODE_ENV=development on the `install` half only (not `run build`) —
# `wrangler deploy` itself sets NODE_ENV=production for this child process,
# which makes `npm install` skip devDependencies. vite and its plugins live
# in mail-vue's devDependencies, so without this override the build fails
# with `sh: 1: vite: not found`. `&&` scopes the override to `install`
# only; `run build` keeps Wrangler's NODE_ENV=production, which is correct
# for a release build.
[build]
command = "ELECTRON_SKIP_BINARY_DOWNLOAD=1 NODE_ENV=development npm --prefix ../mail-vue install --legacy-peer-deps && npm --prefix ../mail-vue run build"
