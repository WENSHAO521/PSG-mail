name = "${NAME}"
main = "src/index.js"
compatibility_date = "2025-06-04"

[observability]
enabled = true

[[routes]]
pattern = "${CUSTOM_DOMAIN}"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${KV_NAMESPACE_ID}"

[[r2_buckets]]
binding = "r2"
bucket_name = "${R2_BUCKET_NAME}"

[ai]
binding = "ai"

# See wrangler.toml for what this is.
[[durable_objects.bindings]]
name = "SCHEDULED_SEND_ALARM"
class_name = "ScheduledSendAlarm"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduledSendAlarm"]

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["* * * * *", "*/30 * * * *", "0 16 * * *"]


[vars]
ai_model = "${AI_MODEL}"
analysis_cache = "${ANALYSIS_CACHE}"
#orm_log = false
domain = "${DOMAIN}"
admin = "${ADMIN}"
# jwt_secret / maintenance_secret are deliberately NOT here — both are
# Cloudflare Worker Secrets, uploaded together with the code by the deploy
# workflow's single `wrangler deploy --secrets-file` step (see
# .github/workflows/deploy-cloudflare.yml), never written into this file's
# [vars] as plaintext (a plaintext var is readable by anyone with
# `wrangler deploy`/dashboard access to this config, which a real secret
# isn't). jwt_secret signs login JWTs only; maintenance_secret separately
# gates /init and /reset-admin — see mail-worker/src/init/init.js and
# mail-worker/src/api/reset-admin-api.js.
project_link = "${PROJECT_LINK}"

linuxdo_client_id = "${LINUXDO_CLIENT_ID}"
linuxdo_client_secret = "${LINUXDO_CLIENT_SECRET}"
linuxdo_callback_url = "${LINUXDO_CALLBACK_URL}"
linuxdo_switch = "${LINUXDO_SWITCH}"

# mail-vue is an npm project (package-lock.json, no pnpm-lock.yaml — same
# as release.yml's `npm ci` and wrangler.toml's self-host template below).
# Installing it with pnpm here was a latent bug: pnpm's strict, non-hoisted
# node_modules breaks src/psg-mail-sw.js's `import ... from
# 'workbox-precaching'` (a transitive dependency of vite-plugin-pwa, never
# a direct one — works under npm's hoisted layout by accident, fails
# outright under pnpm with "Rollup failed to resolve import
# workbox-precaching"). Confirmed by reproducing both this and the
# NODE_ENV issue below locally against the real package.json.
#
# Keep the frontend build in mail-worker/package.json so direct Wrangler
# deploys and Cloudflare Workers Builds use the same entrypoint. The script
# installs and builds mail-vue, then verifies the generated assets in dist.
[build]
command = "npm run build"
