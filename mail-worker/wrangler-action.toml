name = "${NAME}"
main = "src/index.js"
compatibility_date = "2025-06-04"

[observability]
enabled = true

[[routes]]
pattern = "${CUSTOM_DOMAIN}"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${KV_NAMESPACE_ID}"

[[r2_buckets]]
binding = "r2"
bucket_name = "${R2_BUCKET_NAME}"

[ai]
binding = "ai"

# See wrangler.toml for what this is.
[[durable_objects.bindings]]
name = "SCHEDULED_SEND_ALARM"
class_name = "ScheduledSendAlarm"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduledSendAlarm"]

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["* * * * *", "*/30 * * * *", "0 16 * * *"]


[vars]
ai_model = "${AI_MODEL}"
analysis_cache = "${ANALYSIS_CACHE}"
#orm_log = false
domain = "${DOMAIN}"
admin = "${ADMIN}"
# jwt_secret / maintenance_secret are deliberately NOT here — both are
# Cloudflare Worker Secrets, uploaded together with the code by the deploy
# workflow's single `wrangler deploy --secrets-file` step (see
# .github/workflows/deploy-cloudflare.yml), never written into this file's
# [vars] as plaintext (a plaintext var is readable by anyone with
# `wrangler deploy`/dashboard access to this config, which a real secret
# isn't). jwt_secret signs login JWTs only; maintenance_secret separately
# gates /init and /reset-admin — see mail-worker/src/init/init.js and
# mail-worker/src/api/reset-admin-api.js.
project_link = "${PROJECT_LINK}"

linuxdo_client_id = "${LINUXDO_CLIENT_ID}"
linuxdo_client_secret = "${LINUXDO_CLIENT_SECRET}"
linuxdo_callback_url = "${LINUXDO_CALLBACK_URL}"
linuxdo_switch = "${LINUXDO_SWITCH}"

# mail-vue is an npm project (package-lock.json, no pnpm-lock.yaml — same
# as release.yml's `npm ci` and wrangler.toml's self-host template below).
# Installing it with pnpm here was a latent bug: pnpm's strict, non-hoisted
# node_modules breaks src/psg-mail-sw.js's `import ... from
# 'workbox-precaching'` (a transitive dependency of vite-plugin-pwa, never
# a direct one — works under npm's hoisted layout by accident, fails
# outright under pnpm with "Rollup failed to resolve import
# workbox-precaching"). Confirmed by reproducing both this and the
# NODE_ENV issue below locally against the real package.json.
#
# NODE_ENV=development on the `install` half only (not `run build`) —
# `wrangler deploy` itself sets NODE_ENV=production for this child
# process (targetConsumer === "deploy" in Wrangler's own source), which
# makes `npm install` skip devDependencies. vite and its plugins live in
# mail-vue's devDependencies, so without this override the build fails
# with `sh: 1: vite: not found`. `&&` scopes the override to `install`
# only; `run build` keeps Wrangler's NODE_ENV=production, which is
# correct for a release build.
#
# scripts/check-vite-env.sh runs between install and build as a presence
# preflight for VITE_WEB_PUSH_VAPID_PUBLIC_KEY (standards Web Push) and the
# legacy VITE_FIREBASE_* vars (see that file) — it executes inside this
# exact subprocess, so it doubles as direct proof that wrangler's [build]
# command actually inherits the job-level env set in
# .github/workflows/deploy-cloudflare.yml, rather than an assumption.
#
# scripts/build-mail-vue.sh then does the actual `vite build --mode
# release`, but first writes whichever of those vars are set into a
# short-lived mail-vue/.env.release.local (loadEnv() in
# mail-vue/vite.config.js reads it) and afterwards runs
# check-built-web-push-env.mjs against the real built output in
# mail-worker/dist — proof the value reached the bundle itself, not just
# this subprocess's env. See both scripts for why: a passing
# check-vite-env.sh only proves the env var exists here, not that Vite's
# define/import.meta.env replacement actually picked it up.
[build]
command = "ELECTRON_SKIP_BINARY_DOWNLOAD=1 NODE_ENV=development npm --prefix ../mail-vue install --legacy-peer-deps && sh ./scripts/check-vite-env.sh && sh ./scripts/build-mail-vue.sh"
