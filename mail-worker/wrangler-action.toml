name = "${NAME}"
main = "src/index.js"
compatibility_date = "2025-06-04"

[observability]
enabled = true

[[routes]]
pattern = "${CUSTOM_DOMAIN}"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${KV_NAMESPACE_ID}"

[[r2_buckets]]
binding = "r2"
bucket_name = "${R2_BUCKET_NAME}"

[ai]
binding = "ai"

# See wrangler.toml for what this is.
[[durable_objects.bindings]]
name = "SCHEDULED_SEND_ALARM"
class_name = "ScheduledSendAlarm"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduledSendAlarm"]

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["* * * * *", "*/30 * * * *", "0 16 * * *"]


[vars]
ai_model = "${AI_MODEL}"
analysis_cache = "${ANALYSIS_CACHE}"
#orm_log = false
domain = "${DOMAIN}"
admin = "${ADMIN}"
# jwt_secret is deliberately NOT here — it's a Cloudflare Worker Secret
# (`wrangler secret put jwt_secret`, see the deploy workflow's "🔐 同步
# Worker Secrets" step), not a plaintext [vars] entry. It signs every login
# JWT and gates /init and /reset-admin; a plaintext var is readable by
# anyone with `wrangler deploy`/dashboard access to this config, which a
# real secret isn't.
project_link = "${PROJECT_LINK}"

linuxdo_client_id = "${LINUXDO_CLIENT_ID}"
linuxdo_client_secret = "${LINUXDO_CLIENT_SECRET}"
linuxdo_callback_url = "${LINUXDO_CALLBACK_URL}"
linuxdo_switch = "${LINUXDO_SWITCH}"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
