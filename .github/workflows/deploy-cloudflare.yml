name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - "mail-worker/**"
      # mail-vue is built as part of the `[build] command` wrangler runs
      # during deploy (see mail-worker/wrangler-action.toml) — without this,
      # a mail-vue-only change (firebase.js, service worker, sync logic...)
      # never triggers a redeploy and silently stays live on the old bundle.
      - "mail-vue/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  Deploy-cloud-mail:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest

    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN }}
      # DOMAIN/ADMIN are not secrets (a mail domain list and an admin
      # email/username aren't sensitive on their own) — Variable is the
      # right store; kept as a secrets-or-vars fallback so either works.
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN || vars.ADMIN }}
      # JWT_SECRET signs every login JWT — nothing else. Secret only, no
      # vars fallback. It's uploaded together with the code in the single
      # `wrangler deploy --secrets-file` call below (see "🔐🚀 构建
      # Secrets 文件并部署"), never written into wrangler-action.toml's
      # [vars] as plaintext, and never passed to `wrangler secret put`
      # (each `secret put` call creates its own immediate deployment —
      # see the same step's comment for why that's avoided here).
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # MAINTENANCE_SECRET is a separate credential from JWT_SECRET — it
      # gates only the deploy-bootstrap/recovery endpoints (POST /api/init,
      # POST /api/reset-admin), never JWT signing. Keeping it independent
      # means rotating one doesn't invalidate the other (rotating
      # JWT_SECRET logs out every user; rotating MAINTENANCE_SECRET does
      # not). See mail-worker/src/init/init.js and
      # mail-worker/src/api/reset-admin-api.js.
      MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      PROJECT_LINK: ${{ secrets.PROJECT_LINK || vars.PROJECT_LINK }}
      AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct-fast' }}
      CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL || vars.CF_EMAIL || false }}
      ANALYSIS_CACHE: ${{ secrets.ANALYSIS_CACHE || vars.ANALYSIS_CACHE || false }}
      LINUXDO_CLIENT_ID: ${{ secrets.LINUXDO_CLIENT_ID || vars.LINUXDO_CLIENT_ID }}
      LINUXDO_CLIENT_SECRET: ${{ secrets.LINUXDO_CLIENT_SECRET || vars.LINUXDO_CLIENT_SECRET }}
      LINUXDO_CALLBACK_URL: ${{ secrets.LINUXDO_CALLBACK_URL || vars.LINUXDO_CALLBACK_URL }}
      LINUXDO_SWITCH: ${{ secrets.LINUXDO_SWITCH || vars.LINUXDO_SWITCH }}
      # Firebase web config (public client identifiers) — feeds the mail-vue
      # build that runs as part of the wrangler deploy [build] command below.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      # MUST come from Firebase Console -> Project Settings -> Cloud Messaging
      # -> Web Push certificates -> "Key pair" (generate one if none exists).
      # That key is ~87 base64url characters starting with "B". This is NOT
      # the Analytics Measurement ID shown elsewhere in the console (format
      # "G-XXXXXXXXXX") — that value silently breaks getToken() in
      # mail-vue/src/firebase.js (wrong key type, no useful error). The
      # "🛠️ 设置环境" step below fails the deploy early if this looks like a
      # Measurement ID instead of a VAPID key.
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
      # Firebase Admin service account — secrets only, never falls back to
      # vars, and (when all three are set) is uploaded via the same
      # `wrangler deploy --secrets-file` call as jwt_secret/maintenance_secret
      # below — not written into any .toml, not pushed with `secret put`.
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}


    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}


    steps:
      - name: 🚚 检出代码仓库 / Checkout repository
        uses: actions/checkout@v4

      - name: ⚙ 设置 pnpm / Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 9

      - name: ⚙ 设置 Node.js / Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: 📦 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: 📡 禁用 Wrangler 遥测 / Disable wrangler telemetry
        working-directory: ./mail-worker
        run: pnpm wrangler telemetry disable

      - name: 🛠️ 设置环境 / Set up environment
        working-directory: ./mail-worker
        run: |
          
          echo "🔐 Starting environment setup..."
          
          if [ -z "$JWT_SECRET" ] || grep -q '[?%#/\\]' <<< "$JWT_SECRET"; then
            echo "❌ JWT_SECRET variable is empty or contains invalid characters (?, %, #, /, \\)."
            exit 1
          fi

          if [ -z "$MAINTENANCE_SECRET" ]; then
            echo "❌ MAINTENANCE_SECRET variable is empty. It must be set independently of JWT_SECRET — see .github/workflows/deploy-cloudflare.yml's env block comment."
            exit 1
          fi

          if ! jq -e 'type == "array"' <<< "$DOMAIN" ; then
            echo "❌ DOMAIN variable must be a JSON array (e.g., [\"example.com\"])."
            exit 1
          fi
          
          if [ -z "$ADMIN" ]; then
            echo "❌ ADMIN variable cannot be empty."
            exit 1
          fi
          
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID variable cannot be empty."
            exit 1
          fi
          
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN variable cannot be empty."
            exit 1
          fi

          # VITE_FIREBASE_VAPID_KEY is optional (push stays disabled if unset),
          # but if it IS set it must be a real Web Push certificate key, not
          # the Analytics Measurement ID (format "G-XXXXXXXXXX") from a
          # different part of the Firebase console — that mistake builds
          # successfully but silently breaks getToken() with no useful error
          # until someone opens devtools. See the env var comment above.
          if [ -n "$VITE_FIREBASE_VAPID_KEY" ]; then
            if [[ "$VITE_FIREBASE_VAPID_KEY" == G-* ]]; then
              echo "❌ VITE_FIREBASE_VAPID_KEY looks like a Measurement ID (starts with 'G-'), not a VAPID key."
              echo "   Get the real key from Firebase Console → Project Settings → Cloud Messaging → Web Push certificates."
              exit 1
            fi
            if [ "${#VITE_FIREBASE_VAPID_KEY}" -lt 60 ]; then
              echo "❌ VITE_FIREBASE_VAPID_KEY is too short to be a real VAPID key (expected ~87 characters)."
              exit 1
            fi
          fi
          
          if [ -z "$CUSTOM_DOMAIN" ]; then
            echo "::warning:: CUSTOM_DOMAIN variable is not set."
          fi

          # Preflight for the mail-vue production build: these 7 vars are
          # read by mail-vue/src/firebase.js via import.meta.env at Vite
          # build time. Presence-only check (values are never printed) —
          # GitHub Repository Variables existing is not the same as them
          # actually reaching this job's env (wrong scope, wrong
          # environment, typo'd name, ...), and a missing one used to only
          # surface much later as "Firebase 应用初始化失败" in production
          # with nothing pointing back at the actual cause. Runs before the
          # deploy step below, which is what invokes the real `vite build`
          # via wrangler-action.toml's [build] command.
          echo "🔎 Checking Firebase frontend variables are present..."
          MISSING_VITE_VARS=""
          for VAR_NAME in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
                          VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID \
                          VITE_FIREBASE_APP_ID VITE_FIREBASE_VAPID_KEY; do
            if [ -z "${!VAR_NAME}" ]; then
              MISSING_VITE_VARS="$MISSING_VITE_VARS $VAR_NAME"
            fi
          done
          if [ -n "$MISSING_VITE_VARS" ]; then
            echo "❌ Missing required frontend Firebase variable(s):$MISSING_VITE_VARS"
            exit 1
          fi
          echo "✅ All 7 VITE_FIREBASE_* variables are present."

          CONFIG_FILE="wrangler-action.toml"
          
          if [ -z "$R2_BUCKET_NAME" ]; then
            sed -i '/\[\[r2_buckets\]\]/,/^$/d' "$CONFIG_FILE"
          fi
          
          if [ -z "$PROJECT_LINK" ]; then
            sed -i '/^project_link = /d' "$CONFIG_FILE"
          fi
          
          if [ -z "$LINUXDO_CLIENT_ID" ] || [ -z "$LINUXDO_CLIENT_SECRET" ]; then
            sed -i '/^linuxdo_client_id = /,/^linuxdo_switch = /d' "$CONFIG_FILE"
          fi
          
          if [ -z "$CUSTOM_DOMAIN" ]; then
            sed -i '/\[\[routes\]\]/,/^$/d' "$CONFIG_FILE"
          fi
          
          if [ "$(printf '%s' "$CLOUDFLARE_EMAIL" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
            cat >> "$CONFIG_FILE" <<'EOF'

          [[send_email]]
          name = "email"
          EOF
          fi

          sed -i "s|\${NAME}|${NAME}|g" "$CONFIG_FILE"
          sed -i "s|\${CUSTOM_DOMAIN}|${CUSTOM_DOMAIN}|g" "$CONFIG_FILE"
          sed -i "s|\"\${DOMAIN}\"|${DOMAIN}|g" "$CONFIG_FILE"
          sed -i "s|\${ADMIN}|${ADMIN}|g" "$CONFIG_FILE"
          # No jwt_secret/maintenance_secret substitution here —
          # wrangler-action.toml has no such [vars] entries to fill in;
          # both are pushed as real Worker Secrets via the "🔐🚀 构建
          # Secrets 文件并部署" step's `wrangler deploy --secrets-file` below.
          sed -i "s|\${R2_BUCKET_NAME}|${R2_BUCKET_NAME}|g" "$CONFIG_FILE"
          sed -i "s|\${PROJECT_LINK}|${PROJECT_LINK}|g" "$CONFIG_FILE"
          sed -i "s|\${ANALYSIS_CACHE}|${ANALYSIS_CACHE}|g" "$CONFIG_FILE"
          sed -i "s|\${AI_MODEL}|${AI_MODEL}|g" "$CONFIG_FILE"
          sed -i "s|\${LINUXDO_CLIENT_ID}|${LINUXDO_CLIENT_ID}|g" "$CONFIG_FILE"
          sed -i "s|\${LINUXDO_CLIENT_SECRET}|${LINUXDO_CLIENT_SECRET}|g" "$CONFIG_FILE"
          sed -i "s|\${LINUXDO_CALLBACK_URL}|${LINUXDO_CALLBACK_URL}|g" "$CONFIG_FILE"
          sed -i "s|\${LINUXDO_SWITCH}|${LINUXDO_SWITCH}|g" "$CONFIG_FILE"
          
          echo "✅ Environment setup completed."

      - name: ⚡ 设置KV数据库 / Set up KV database
        working-directory: ./mail-worker
        run: |
          
          CONFIG_FILE="wrangler-action.toml"
          
          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" "$CONFIG_FILE"
            echo "✅ Using the database from environment variables."
            exit 0
          fi
          
          echo "🔍 Checking if the database exists..."
          
          set +e
            KV_LIST=$(pnpm wrangler kv namespace list 2>&1)
            STATUS=$?
          set -e
          
          if [ $STATUS -ne 0 ]; then
            echo "$KV_LIST"
            exit 1
          fi
                  
          if echo "$KV_LIST" | jq -e ".[] | select(.title == \"$NAME\")" >/dev/null; then
            echo "✅ Database $NAME already exists."
            KV_ID=$(echo "$KV_LIST" | jq -r ".[] | select(.title == \"$NAME\") | .id")
            echo "KV_NAMESPACE_ID: $KV_ID"
          else
            echo "⚠️ Database $NAME does not exist. Starting creation..."
            pnpm wrangler kv namespace create $NAME
            KV_LIST=$(pnpm wrangler kv namespace list)
            KV_ID=$(echo "$KV_LIST" | jq -r ".[] | select(.title == \"$NAME\") | .id")
          fi
          
          sed -i "s|\${KV_NAMESPACE_ID}|$KV_ID|g" "$CONFIG_FILE"
          echo "✅ Setup completed."

      - name: 🐬 设置D1数据库 / Set up D1 database
        working-directory: ./mail-worker
        run: |
          
          CONFIG_FILE="wrangler-action.toml"
          
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" "$CONFIG_FILE"
            echo "✅ Using the database from environment variables."
            exit 0
          fi
          
          echo "🔍 Checking if the database exists..."
          
          set +e
            DB_LIST=$(pnpm wrangler d1 list --json 2>&1)
            STATUS=$?
          set -e
          
          if [ $STATUS -ne 0 ]; then
            echo "$DB_LIST"
            exit 1
          fi
          
          if echo "$DB_LIST" | jq -e ".[] | select(.name == \"$NAME\")" >/dev/null; then
            echo "✅ Database $NAME already exists."
            D1_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$NAME\") | .uuid")
            echo "D1_DATABASE_ID: $D1_ID"
          else
            echo "⚠️ Database $NAME does not exist. Starting creation..."
            pnpm wrangler d1 create $NAME
            DB_LIST=$(pnpm wrangler d1 list --json)
            D1_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$NAME\") | .uuid")
          fi
          
          sed -i "s|\${D1_DATABASE_ID}|$D1_ID|g" "$CONFIG_FILE"
          echo "✅ Setup completed."

      - name: 🧬 应用数据库迁移 / Apply D1 migrations
        working-directory: ./mail-worker
        run: |
          echo "🧬 Applying D1 migrations (see mail-worker/migrations/README.md)..."
          # "db" is the binding name (wrangler-action.toml's [[d1_databases]]
          # database_name is a hardcoded "cloud-mail" literal, not templated
          # with $NAME — the binding always resolves correctly regardless).
          pnpm wrangler d1 migrations apply db --remote -c wrangler-action.toml

      # Code and Worker Secrets go up in ONE `wrangler deploy
      # --secrets-file` call — not `wrangler secret put` (which, per
      # current Wrangler behavior, creates and immediately deploys its own
      # new Worker version per call — i.e. one `secret put` per secret plus
      # a trailing `wrangler deploy` used to mean up to 4 separate
      # deployments for a single CI run, each one briefly live on its own).
      # A single `--secrets-file` deploy keeps "migrations → one atomic
      # Worker deployment → smoke test" actually atomic. The secrets file
      # lives only on this runner's temp filesystem: mode 600, never
      # printed/catted, no `set -x`, never uploaded as an artifact, and
      # removed via `trap ... EXIT` so it's gone even if the deploy fails.
      - name: 🔐🚀 构建 Secrets 文件并部署 / Build secrets file and deploy
        id: deploy
        working-directory: ./mail-worker
        run: |
          SECRETS_FILE="$(mktemp)"
          chmod 600 "$SECRETS_FILE"
          trap 'rm -f "$SECRETS_FILE"' EXIT

          # jwt_secret and maintenance_secret are both required (validated
          # non-empty earlier in "🛠️ 设置环境"). jwt_secret signs every
          # login JWT; maintenance_secret separately gates /api/init and
          # /api/reset-admin (see mail-worker/src/init/init.js and
          # mail-worker/src/api/reset-admin-api.js) — the two are no longer
          # the same value. Read via jq's `env.NAME` (reads the process
          # environment directly) rather than `--arg`, so the secret values
          # never appear as command-line arguments.
          #
          # Reusing whatever jwt_secret a currently-live Worker (deployed
          # some other way) already has is required — a different value
          # here invalidates every existing user's session the moment this
          # takes effect. See mail-worker/migrations/ROLLOUT.md.
          FIREBASE_SET=0
          [ -n "$FIREBASE_PROJECT_ID" ] && FIREBASE_SET=$((FIREBASE_SET + 1))
          [ -n "$FIREBASE_CLIENT_EMAIL" ] && FIREBASE_SET=$((FIREBASE_SET + 1))
          [ -n "$FIREBASE_PRIVATE_KEY" ] && FIREBASE_SET=$((FIREBASE_SET + 1))

          if [ "$FIREBASE_SET" -eq 3 ]; then
            jq -n '{
              jwt_secret: env.JWT_SECRET,
              maintenance_secret: env.MAINTENANCE_SECRET,
              FIREBASE_PROJECT_ID: env.FIREBASE_PROJECT_ID,
              FIREBASE_CLIENT_EMAIL: env.FIREBASE_CLIENT_EMAIL,
              FIREBASE_PRIVATE_KEY: env.FIREBASE_PRIVATE_KEY
            }' > "$SECRETS_FILE"
            echo "✅ jwt_secret + maintenance_secret + Firebase secrets included — push notifications enabled."
          elif [ "$FIREBASE_SET" -eq 0 ]; then
            jq -n '{
              jwt_secret: env.JWT_SECRET,
              maintenance_secret: env.MAINTENANCE_SECRET
            }' > "$SECRETS_FILE"
            echo "::notice:: FIREBASE_PROJECT_ID / FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY not set. FCM sending disabled."
          else
            jq -n '{
              jwt_secret: env.JWT_SECRET,
              maintenance_secret: env.MAINTENANCE_SECRET
            }' > "$SECRETS_FILE"
            echo "::warning:: Only $FIREBASE_SET of 3 Firebase secrets are set (need FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, and FIREBASE_PRIVATE_KEY together, or none). FCM sending disabled."
          fi

          echo "🚀 Starting deployment..."
          pnpm wrangler deploy -c wrangler-action.toml --secrets-file "$SECRETS_FILE" 2>&1 \
            | tee deploy.log \
            | grep -v "https://.*\.workers\.dev" \
            | sed -E 's/env\.domain .*/env.domain (***)/' \
            || true

          DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            exit 1
          fi

          WORKER_URL=$(grep -o "https://.*\.workers\.dev" deploy.log || echo "")

          if [ -n "$WORKER_URL" ]; then
            echo "::add-mask::$WORKER_URL"
          fi

          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "✅ Deploy completed."

      - name: ♻️ 初始化数据库 / Initialize database
        run: |
          echo "🛠️ Starting database initialization..."
          sleep 15

          WORKER_URL="${CUSTOM_DOMAIN:+https://$CUSTOM_DOMAIN}"
          WORKER_URL="${WORKER_URL:-${{ steps.deploy.outputs.worker_url }}}"

          if [ -z "$WORKER_URL" ]; then
            echo "❌ Preview URL not available. Please set CUSTOM_DOMAIN."
            exit 1
          fi

          # POST + Authorization header, not GET /api/init/<secret> — a
          # secret embedded in a URL can land in request/proxy/observability
          # logs even over HTTPS (logged server-side, not just visible in
          # transit), a header does not. See src/api/init-api.js.
          #
          # Bearer MAINTENANCE_SECRET, not JWT_SECRET — /api/init is a
          # deploy-bootstrap endpoint, not a JWT-authenticated one; it's
          # gated by maintenance_secret on the Worker side (see
          # src/init/init.js), a credential kept separate from the one
          # that signs login JWTs.
          HTTP_CODE=$(curl -sL -X POST -w "%{http_code}" -o response.txt \
            -H "Authorization: Bearer ${MAINTENANCE_SECRET}" \
            "$WORKER_URL/api/init")
          RESPONSE_BODY=$(cat response.txt)

          if [ "$RESPONSE_BODY" = "success" ]; then
            echo "✅ Setup completed."
          else
            echo "❌ Failed. HTTP: $HTTP_CODE, Response: $RESPONSE_BODY"
            exit 1
          fi

          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: 🩺 冒烟测试 / Smoke test
        run: |
          # Unauthenticated, side-effect-free, and its response actually
          # depends on D1/KV working (not a trivial static 200) — deliberately
          # NOT /api/init (that's a bootstrap action, not a health check, and
          # re-running it would just re-run schema setup for no reason).
          HTTP_CODE=$(curl -sL -o response.txt -w "%{http_code}" "$WORKER_URL/api/setting/websiteConfig")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Smoke test failed: GET /api/setting/websiteConfig returned HTTP $HTTP_CODE"
            cat response.txt
            exit 1
          fi
          echo "✅ Smoke test passed (HTTP 200 from /api/setting/websiteConfig)."

      - name: 🗑️ 删除运行记录 / Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: '1'
          keep_minimum_runs: '0'
