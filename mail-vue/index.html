<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#F3F5F7" id="theme-color-meta">
  <meta name="description" content="PSG Mail — Panorama Scholarly Group institutional email client for web, desktop and mobile.">
  <title>PSG Mail</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const uiStoreStr = localStorage.getItem('ui')
    const settingStoreStr = localStorage.getItem('setting')
    let dark = false
    if (uiStoreStr) {
      try {
        const uiStore = JSON.parse(uiStoreStr)
        dark = !!uiStore.dark
        document.documentElement.setAttribute('class', dark ? 'dark' : '')
      } catch {}
    }
    if (settingStoreStr) {
      try {
        const settingStore = JSON.parse(settingStoreStr)
        document.documentElement.lang = settingStore.lang === 'zh' ? 'zh-CN' : 'en'
      } catch {}
    }
    const metaTag = document.getElementById('theme-color-meta')
    metaTag.setAttribute('content', dark ? '#11151B' : '#F3F5F7')
  </script>
</head>
<style>
  html {
    background: #F3F5F7;
  }
  html.dark {
    background: #11151B;
  }
  #loading-first {
    position: fixed;
    inset: 0;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: #F3F5F7;
    transition: opacity 180ms ease;
  }

  html.dark #loading-first {
    background: #11151B;
  }

  .loading-hide {
    pointer-events: none;
    opacity: 0;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .loading-image {
    width: 64px;
    height: 64px;
    object-fit: contain;
  }

  html.dark .loading-image {
    filter: invert(1);
  }

  .loading-progress {
    position: relative;
    width: 72px;
    height: 3px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(25, 27, 32, 0.10);
  }

  html.dark .loading-progress {
    background: rgba(255, 255, 255, 0.10);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: #B4233D;
    transform: scaleX(0);
    transform-origin: left center;
    animation: loading-progress-grow 2.4s linear forwards;
  }

  .loading-progress::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 100%;
    border-radius: inherit;
    background: rgba(180, 35, 61, 0.32);
    filter: blur(4px);
    transform: translateX(-24px);
    animation: loading-progress-peg 2.4s linear forwards;
  }

  .loading-complete .loading-progress::before {
    animation: none;
    transform: scaleX(1);
    transition: transform 200ms linear;
  }

  .loading-complete .loading-progress::after {
    animation: none;
    transform: translateX(68px);
    transition: transform 200ms linear;
  }

  @keyframes loading-progress-grow {
    0% { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }

  @keyframes loading-progress-peg {
    0% { transform: translateX(-24px); }
    100% { transform: translateX(68px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .loading-progress::before,
    .loading-progress::after {
      animation-duration: .01ms;
    }
  }
</style>
<body>
<div id="loading-first">
  <div class="loading-icon">
    <img class="loading-image" src="/image/psg-logo.png" alt="PSG Mail">
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
